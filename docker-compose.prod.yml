# Production deployment — uses pre-built images from GitHub Container Registry.
# Replace the image tag below with the desired release version.
# Available tags: https://github.com/nutellinoit/email-buddy/releases

services:
  email-buddy:
    image: ghcr.io/nutellinoit/email-buddy:v1.0.0  # ← set your version here
    container_name: email-buddy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  email-buddy-web:
    image: ghcr.io/nutellinoit/email-buddy-web:v1.0.0  # ← same version
    container_name: email-buddy-web
    restart: unless-stopped
    ports:
      - "3123:3000"
    environment:
      - API_URL=http://email-buddy:8000
    depends_on:
      - email-buddy
